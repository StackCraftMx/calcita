# Sirve los ejemplos ya construidos (la imagen del Dockerfile de la raíz).
#
# Los ejemplos son una sola página con rutas del navegador (react-router): /orders, /customers… no existen como
# archivos. Cualquier dirección que no sea un archivo regresa index.html y la app decide qué pintar; sin esto, recargar en
# /orders daba 404.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nada de la versión de nginx en los errores ni en los encabezados
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # los archivos de assets llevan su huella en el nombre (index-a1b2c3.js): se guardan un año en el navegador
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        # index.html nunca se guarda: así una versión nueva se ve al recargar
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
